# CNB pipelines for the Zed YOLO fork.
# Source base: zed-industries/zed v1.20.0-pre (preview).
#
# Stage 1 of the two-stage build (BUILDING.md) on CNB compute, as the
# automatic counterpart of the manual r740 run. Three pipelines:
#
#   $: vscode:    the build. `services: [vscode]` places it on the Dev-CPU pool
#                 (1600 core-hours/month) instead of Build-CPU (160). It runs
#                 every stage for `zed` and `cli`, resolves the `enhanced/*` tag from the commit,
#                 publishes the stage-1 assets to that tag's release, and stops
#                 itself. Sized at 16 cpu / 32 GiB: the `zed` link needs 23 GiB
#                 and the whole build averaged 4 to 7 cores on a 64-cpu runner
#                 (BUILDING.md §1.3).
#   $: tag_push:  a 1-cpu Build-CPU pipeline that starts the workspace on the
#                 tag's commit and exits (.cnb/start-cross-build-workspace.sh).
#   $: web_trigger_cross_build:
#                 the same, for the "Cross-build this commit" button on a
#                 branch page (.cnb/web_trigger.yml).
#
# All live under `$` because `vscode`, `tag_push` and `web_trigger*` are
# repository-level events. The workspace's user-data backup is capped at
# 100 MB, hence the cleanup stage.
$:
  tag_push:
    - name: zed-yolo-release-trigger
      runner:
        cpus: 1
        tags: cnb:arch:amd64
      docker:
        image: alpine:3.20
      stages:
        - name: start-cross-build-workspace
          script: |
            set -eu
            case "$CNB_BRANCH" in
              enhanced/*) ;;
              *) echo "tag $CNB_BRANCH is not an enhanced/* release tag; nothing to build"; exit 78 ;;
            esac
            sh .cnb/start-cross-build-workspace.sh

  web_trigger_cross_build:
    - name: zed-yolo-manual-trigger
      runner:
        cpus: 1
        tags: cnb:arch:amd64
      docker:
        image: alpine:3.20
      stages:
        - name: start-cross-build-workspace
          script: sh .cnb/start-cross-build-workspace.sh

  vscode:
    - name: zed-yolo-cross-build
      runner:
        cpus: 16
        tags: cnb:arch:amd64
      docker:
        build:
          dockerfile: .cnb/Dockerfile.zed-macos
          by:
            - .cnb/Dockerfile.zed-macos
          # Rebuild the 9 GB image only when the toolchain changes, not on
          # every Cargo.lock bump.
          versionBy:
            - .cnb/Dockerfile.zed-macos
            - rust-toolchain.toml
        # The container runs under user namespaces; `:rw` volumes are
        # root-owned host directories that the namespaced root cannot write
        # (Permission denied on 2026-09-14). The default copy-on-write type is
        # an overlay: writable during the run, merged into the volume on
        # success, so the caches still warm up across runs.
        volumes:
          - zed-yolo-cow-cargo-registry:/usr/local/cargo/registry:copy-on-write
          - zed-yolo-cow-cargo-git:/usr/local/cargo/git:copy-on-write
          - zed-yolo-cow-sccache:/var/cache/sccache:copy-on-write
          - zed-yolo-cow-target:/workspace/target:copy-on-write
      services:
        - name: vscode
          options:
            onlyPreview: true
            # Safety net: the stop-workspace end stage normally ends the run.
            keepAliveTimeout: 10m
      env:
        CARGO_INCREMENTAL: "0"
        CARGO_TERM_COLOR: never
        CARGO_BUILD_JOBS: "16"
        RUSTC_WRAPPER: sccache
        SCCACHE_DIR: /var/cache/sccache
        SCCACHE_CACHE_SIZE: 80G
        BUILD_LOG_POLL_SECONDS: "5"
        BUILD_HEARTBEAT_SECONDS: "120"
        ZED_BUNDLE: "true"
        ZED_ENHANCED_LABEL: Enhanced
        ZED_UPDATE_EXPLANATION: "This Enhanced build is updated through the zed-yolo release process, not by zed.dev."
        ZED_YOLO_RUNNER_CPUS: "16"
        ZED_YOLO_RUNNER_MEMORY_GIB: "32"
        ZED_YOLO_BENCHMARK: cnb-dev-cpu16
      stages:
        - name: toolchain
          script: |
            set -eux
            rustc -Vv
            cargo -V
            id
            nproc
            free -h
            df -h /workspace /var/cache/sccache
            touch /usr/local/cargo/git/.writable /usr/local/cargo/registry/.writable /var/cache/sccache/.writable /workspace/target/.writable
            aarch64-apple-darwin-clang --version | head -n 1
            cat /etc/zed-yolo-toolchain.json
            test -d "$SDKROOT"
            llvm-nm "$(clang -print-resource-dir)/lib/darwin/libclang_rt.osx.a" | grep -q ___isPlatformVersionAtLeast
            sccache --show-stats || true
        - name: macho-linker-dedupe-smoke
          script: bash .cnb/run-zed-build-step.sh macho-smoke
        - name: generate-licenses
          script: |
            set -eux
            ALLOW_MISSING_LICENSES=yes script/generate-licenses
        - name: init-release-metadata
          script: bash .cnb/run-zed-build-step.sh metadata
        - name: build-aarch64-apple-darwin-zed-cli
          script: >
            bash .cnb/run-zed-build-step.sh build
            aarch64-apple-darwin zed-cli
            --package zed --package cli
        - name: package-aarch64-apple-darwin
          script: bash .cnb/run-zed-build-step.sh package aarch64-apple-darwin zed-cli
        - name: build-cache-stats
          script: bash .cnb/run-zed-build-step.sh stats
        - name: publish-release
          script: |
            set -eu
            ls -lh dist/
            # The workspace is started on a commit, so CNB_BRANCH is the branch,
            # not the tag. Find the enhanced/* tag this build belongs to: a tag on
            # HEAD, or the nearest one whose compiled sources equal HEAD's (docs
            # and tooling commits after the tag do not change the binaries;
            # MAINTAINING.md §11.1). Anything else stays unpublished.
            git fetch -q --tags origin || echo "note: could not fetch tags"
            release_tag=$(git tag --points-at HEAD | grep '^enhanced/' | tail -n 1 || true)
            if [ -z "$release_tag" ]; then
              nearest=$(git describe --tags --abbrev=0 --match 'enhanced/*' 2>/dev/null || true)
              if [ -n "$nearest" ] && git diff --quiet "$nearest" HEAD -- crates Cargo.lock Cargo.toml .cargo; then
                release_tag=$nearest
              fi
            fi
            # First publisher wins: a release that already carries a Darwin package
            # (same tree, earlier run) is left alone. A source change gets a new tag.
            if [ -n "$release_tag" ]; then
              existing=$(curl -fsS -H "Authorization: Bearer $CNB_TOKEN" -H "Accept: application/json" \
                "$CNB_API_ENDPOINT/$CNB_REPO_SLUG/-/releases/tags/$(printf '%s' "$release_tag" | sed 's#/#%2F#g')" \
                | jq -r '.assets[]?.name' | grep -c 'aarch64-apple-darwin.*\.tar\.zst$' || true)
              if [ "${existing:-0}" != 0 ]; then
                echo "release $release_tag already has its Darwin package; not publishing again"
                release_tag=""
              fi
            fi
            if [ -n "$release_tag" ]; then
              echo "publishing to release $release_tag"
              # The Darwin package feeds stage 2 on the Mac.
              script/publish-cnb-release --repo "$CNB_REPO_SLUG" --tag "$release_tag" \
                dist/zed-yolo-v*-aarch64-apple-darwin-*.tar.zst \
                dist/zed-yolo-v*-aarch64-apple-darwin-*.tar.zst.sha256 \
                dist/zed-yolo-v*-aarch64-apple-darwin-*.tar.zst.build.json
            else
              echo "no enhanced/* tag matches this commit's sources; not publishing (assets stay in this run)"
            fi
        - name: cleanup-workspace-dist
          script: |
            set -eux
            rm -rf dist
            git status --short --untracked-files=all
      endStages:
        - name: stop-workspace
          script: |
            set -u
            curl -fsS -X POST \
              -H "Authorization: Bearer $CNB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"pipelineId\":\"$CNB_PIPELINE_ID\"}" \
              "$CNB_API_ENDPOINT/workspace/stop" || echo "self-stop failed; keepAliveTimeout will reclaim the workspace"
